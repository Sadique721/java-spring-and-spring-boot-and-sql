version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: springmastery-postgres
    environment:
      POSTGRES_DB: springmastery
      POSTGRES_USER: springmastery
      POSTGRES_PASSWORD: springmastery123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springmastery -d springmastery"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: springmastery-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@springmastery.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
