databases:
  - name: springmastery-db
    databaseName: springmastery
    user: springmastery
    plan: free
    region: singapore

services:
  - type: web
    name: spring-java-mastery
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # Internal JDBC connection string (postgres:// format — auto-converted by Spring)
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: springmastery-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: springmastery-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: springmastery-db
          property: password
      - key: PORT
        value: "10000"
      - key: SERVER_PORT
        value: "10000"
      # Disable data seeding if DB already has content (set to false after first deploy)
      - key: APP_SEED_ENABLED
        value: "true"
