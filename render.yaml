databases:
  - name: springmastery-db
    databaseName: springmastery
    user: springmastery
    plan: free
    region: singapore

services:
  - type: web
    name: spring-java-mastery
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # Full postgres:// URL — auto-converted to jdbc:postgresql:// by RenderDatabaseUrlPostProcessor
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: springmastery-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: springmastery-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: springmastery-db
          property: password
      - key: PORT
        value: "10000"
      - key: SERVER_PORT
        value: "10000"
