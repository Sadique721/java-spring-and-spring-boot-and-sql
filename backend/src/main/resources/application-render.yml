# ================================================================
# application-render.yml
# Spring Boot profile for Render.com Docker deployment
#
# Render injects these env vars from the managed DB:
#   SPRING_DATASOURCE_URL     → postgres://user:pass@host/dbname
#   SPRING_DATASOURCE_USERNAME → springmastery
#   SPRING_DATASOURCE_PASSWORD → <generated>
#   PORT                       → 10000
# ================================================================

spring:
  application:
    name: spring-java-mastery-backend

  datasource:
    # Render provides "postgres://" URL — Spring Boot auto-converts it
    # to "jdbc:postgresql://" via spring.datasource.url property binding
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${PORT:10000}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.springmastery: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
