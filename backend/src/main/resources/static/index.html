  <style>
    /* Critical inline CSS — prevents FOUC */
    html, body { margin: 0; padding: 0; background: rgb(6,9,19); }

    /* ===== LOADING SCREEN ===== */
    #app-loader {
      position: fixed; inset: 0;
      background: rgb(6,9,19);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #app-loader.loader-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-ring {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top: 4px solid rgb(0,255,157);
      border-right: 4px solid rgb(0,212,255);
      animation: spin 1.2s cubic-bezier(0.6,0,0.4,1) infinite;
      position: relative;
    }
    .loader-ring::after {
      content: '';
      position: absolute; inset: 8px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-bottom: 3px solid rgb(255,107,53);
      border-left: 3px solid rgb(0,255,157);
      animation: spin 0.8s cubic-bezier(0.6,0,0.4,1) infinite reverse;
    }
    .loader-text {
      margin-top: 24px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px; font-weight: 700;
      letter-spacing: 5px; text-transform: uppercase;
      background: linear-gradient(90deg, rgb(0,255,157), rgb(0,212,255), rgb(255,107,53));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: pulse-glow 1.8s ease-in-out infinite;
    }
    .loader-dots {
      display: flex; gap: 8px; margin-top: 20px;
    }
    .loader-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .loader-dots span:nth-child(1) { background: rgb(0,212,255); animation-delay: 0s; }
    .loader-dots span:nth-child(2) { background: rgb(0,255,157); animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { background: rgb(255,107,53); animation-delay: 0.4s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-glow {
      0%,100% { opacity: 0.6; } 50% { opacity: 1; }
    }
    @keyframes dot-bounce {
      0%,100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-10px); opacity: 1; }
    }

    /* ===== PARTICLE CANVAS ===== */
    #particles-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      opacity: 0.5;
    }

    /* ===== BACK TO TOP ===== */
    #back-to-top {
      position: fixed; bottom: 28px; right: 28px; z-index: 100;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.35);
      color: rgb(0,212,255); font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      opacity: 0; transform: scale(0.5); pointer-events: none;
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
    }
    #back-to-top.visible { opacity: 1; transform: scale(1); pointer-events: auto; }
    #back-to-top:hover { background: rgba(0,212,255,0.22); box-shadow: 0 0 30px rgba(0,212,255,0.3); transform: scale(1.1); }
  </style>

<body>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="app-loader" role="status" aria-label="Loading Spring Java Mastery">
    <div class="loader-ring"></div>
    <div class="loader-text">✦ Spring Java Mastery ✦</div>
    <div class="loader-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- ===== PARTICLE BACKGROUND ===== -->
  <canvas id="particles-canvas"></canvas>

  <!-- ===== BACK TO TOP ===== -->
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <!-- ===== ANGULAR APP ROOT ===== -->
  <app-root></app-root>

  <!-- ===== GLOBAL SCRIPTS ===== -->
  <script>
    // ── Particle System ──────────────────────────────────────────────
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const COLORS = [
        'rgba(0,212,255,',
        'rgba(0,255,157,',
        'rgba(255,107,53,'
      ];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          alpha: Math.random() * 0.4 + 0.1,
          life: Math.random()
        };
      }

      for (let i = 0; i < 90; i++) particles.push(createParticle());

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          p.life += 0.003;
          if (p.life > 1) { Object.assign(p, createParticle()); return; }
          const a = p.alpha * Math.sin(p.life * Math.PI);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color + a + ')';
          ctx.fill();
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ── Loader Hide ───────────────────────────────────────────────────
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('app-loader');
        if (loader) loader.classList.add('loader-hidden');
      }, 900);
    });

    // ── Back To Top ───────────────────────────────────────────────────
    var btt = document.getElementById('back-to-top');
    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) btt.classList.add('visible');
      else btt.classList.remove('visible');
    });
    btt.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
